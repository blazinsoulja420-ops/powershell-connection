[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-powershell-agent-bridge"
version = "0.1.1"
description = "UPGS-governed local execution bridge with Exact Relay Autopilot."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
upab = "upab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
